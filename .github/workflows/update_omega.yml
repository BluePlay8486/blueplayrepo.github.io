name: Run omega/update_repo.py

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run omega/update_repo.py
        run: |
          python omega/update_repo.py
          echo "✅ Script omega/update_repo.py finalizado com sucesso!"
          
